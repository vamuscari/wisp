name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust-test:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  rust-quality:
    name: Rustfmt and Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  rust-msrv:
    name: Rust 1.85 MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - run: cargo check --workspace --locked

  opencode-plugin:
    name: OpenCode plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check opencode/wisp.js
      - run: node --test tests/opencode_plugin_test.mjs

  lua-test:
    name: Lua (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: step-security/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.4.8"
      - run: lua tests/run.lua

  format:
    name: StyLua
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: "2.5.2"
          args: --check .

  wezterm:
    name: Minimum WezTerm
    runs-on: ubuntu-latest
    env:
      WEZTERM_ASSET: WezTerm-20240127-113634-bbcac864-Ubuntu20.04.AppImage
      WEZTERM_VERSION: 20240127-113634-bbcac864
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build and deploy Wisp
        run: |
          cargo build --workspace --locked
          WISP_DEPLOY_ROOT="$RUNNER_TEMP/wisp" \
            XDG_CONFIG_HOME="$RUNNER_TEMP/config" \
            ./target/debug/wisp deploy
      - name: Download WezTerm
        run: |
          curl --fail --location --retry 3 --remote-name \
            "https://github.com/wezterm/wezterm/releases/download/${WEZTERM_VERSION}/${WEZTERM_ASSET}"
          curl --fail --location --retry 3 --remote-name \
            "https://github.com/wezterm/wezterm/releases/download/${WEZTERM_VERSION}/${WEZTERM_ASSET}.sha256"
          sha256sum --check "${WEZTERM_ASSET}.sha256"
          chmod +x "${WEZTERM_ASSET}"
      - name: Parse plugin configuration
        run: |
          APPIMAGE_EXTRACT_AND_RUN=1 \
            WISP_DEPLOY_ROOT="$RUNNER_TEMP/wisp" \
            XDG_CONFIG_HOME="$RUNNER_TEMP/config" \
            "./${WEZTERM_ASSET}" --config-file "$PWD/tests/deployed_wezterm_config.lua" ls-fonts --text test >/dev/null

  neovim:
    name: Minimum Neovim
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: rhysd/action-setup-vim@v1
        with:
          version: v0.10.4
          neovim: true
      - name: Build and deploy Wisp
        run: |
          cargo build --workspace --locked
          WISP_DEPLOY_ROOT="$RUNNER_TEMP/wisp" \
            XDG_CONFIG_HOME="$RUNNER_TEMP/config" \
            ./target/debug/wisp deploy
      - name: Load adapter
        run: >-
          nvim --headless -u NONE
          --cmd "set runtimepath+=$RUNNER_TEMP/wisp/nvim"
          -c "lua assert(type(vim.base64.encode) == 'function')"
          -c "lua require('wisp').setup()"
          -c "qa"
