name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Match tag to package version
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "wisp-cli") | .version')"
          test "${GITHUB_REF_NAME}" = "v${version}"

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - name: Build release binary
        run: cargo build --locked --release --package wisp-cli --target ${{ matrix.target }}
      - name: Package archive
        shell: bash
        run: |
          set -euo pipefail
          package="wisp-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "package/$package" dist
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp "target/${{ matrix.target }}/release/wisp.exe" "package/$package/"
          else
            cp "target/${{ matrix.target }}/release/wisp" "package/$package/"
          fi
          cp README.md LICENSE "package/$package/"
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            (cd package && 7z a "../dist/$package.zip" "$package")
          else
            tar -C package -czf "dist/$package.tar.gz" "$package"
          fi
      - name: Smoke test Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $package = "wisp-${{ github.ref_name }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Path smoke | Out-Null
          7z x "dist/$package.zip" -osmoke | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "release archive extraction failed" }
          $binary = Join-Path $PWD "smoke/$package/wisp.exe"
          & $binary --version
          if ($LASTEXITCODE -ne 0) { throw "packaged wisp.exe failed" }
          $env:WISP_DEPLOY_ROOT = Join-Path $env:RUNNER_TEMP "wisp-release-smoke"
          $env:WISP_WEZTERM_CONFIG_DIR = Join-Path $env:RUNNER_TEMP "wezterm-release-smoke"
          & $binary deploy
          if ($LASTEXITCODE -ne 0) { throw "packaged wisp.exe deploy failed" }
          & $binary deploy verify
          if ($LASTEXITCODE -ne 0) { throw "packaged wisp.exe deploy verify failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: wisp-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create checksums
        run: sha256sum dist/* > dist/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
