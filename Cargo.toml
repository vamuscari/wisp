[workspace]
members = ["crates/wisp-cli", "crates/wisp-core", "crates/wisp-tui"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/vamuscari/wisp"
rust-version = "1.85"
version = "0.1.0"

[workspace.dependencies]
blake3 = "1.8.2"
directories = "6.0.0"
fs2 = "0.4.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tempfile = "3.23.0"
thiserror = "2.0.17"
toml = "0.9.8"

[profile.release]
lto = "thin"
strip = true
